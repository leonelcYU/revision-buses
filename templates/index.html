<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisión de Buses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>Sistema de Revisión de Buses</h1>
            <a href="/dashboard" class="nav-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Dashboard
            </a>
        </nav>

        <div class="form-container">
            <h2>Nueva Revisión</h2>
            
            <form id="revisionForm">
                <!-- Búsqueda de PPU -->
                <div class="form-group">
                    <label for="ppuSearch">Buscar PPU</label>
                    <div class="search-wrapper">
                        <input 
                            type="text" 
                            id="ppuSearch" 
                            placeholder="Ingrese parte de la patente (ej: WP57)" 
                            autocomplete="off"
                            required
                        >
                        <div id="searchResults" class="search-results"></div>
                    </div>
                    <input type="hidden" id="ppuSelected" required>
                    <div id="selectedPPU" class="selected-ppu"></div>
                    <div id="ppuAlert" class="ppu-alert" style="display: none;"></div>
                    <button type="button" id="changePPU" class="btn-change-ppu" style="display: none;">Cambiar PPU</button>
                </div>

                <!-- Fecha de Revisión -->
                <div class="form-group">
                    <label for="fechaRevision">Fecha de Revisión</label>
                    <input type="datetime-local" id="fechaRevision" required>
                </div>

                <!-- Campos para PPUs tipo "S" -->
                <div id="camposTipoS" style="display: none;">
                    <!-- Conectividad -->
                    <div class="form-group">
                        <label>Conectividad</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="conectividad" value="si">
                                <span>Sí</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="conectividad" value="no">
                                <span>No</span>
                            </label>
                        </div>
                    </div>

                    <!-- Motivo (condicional) -->
                    <div class="form-group" id="motivoGroup" style="display: none;">
                        <label for="motivo">Motivo de falla de conectividad</label>
                        <textarea id="motivo" rows="3" placeholder="Describa el motivo..."></textarea>
                    </div>

                    <!-- Norma Gráfica -->
                    <div class="form-group">
                        <label>¿Norma Gráfica Correcta?</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="normaGrafica" value="si">
                                <span>Sí</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="normaGrafica" value="no">
                                <span>No</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Disco Duro (para TODAS las PPUs) -->
                <div class="form-group">
                    <label>Disco Duro</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="discoDuro" value="si" required>
                            <span>Sí</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="discoDuro" value="no">
                            <span>No</span>
                        </label>
                    </div>
                </div>

                <!-- Botones -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar Revisión</button>
                    <button type="reset" class="btn btn-secondary">Limpiar</button>
                </div>
            </form>
        </div>

        <div id="notification" class="notification"></div>
    </div>

    <script>
        // Variables globales
        const ppuSearch = document.getElementById('ppuSearch');
        const searchResults = document.getElementById('searchResults');
        const ppuSelected = document.getElementById('ppuSelected');
        const selectedPPU = document.getElementById('selectedPPU');
        const changePPUBtn = document.getElementById('changePPU');
        const ppuAlert = document.getElementById('ppuAlert');
        const camposTipoS = document.getElementById('camposTipoS');
        let esTipoS = false;

        // Autocompletado de PPU
        ppuSearch.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            
            if (query.length < 2) {
                searchResults.innerHTML = '';
                searchResults.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/search-bus?q=${encodeURIComponent(query)}`);
                const buses = await response.json();

                if (buses.length === 0) {
                    searchResults.innerHTML = '<div class="search-item no-results">No se encontraron coincidencias</div>';
                    searchResults.style.display = 'block';
                } else {
                    searchResults.innerHTML = buses.map(bus => 
                        `<div class="search-item" data-ppu="${bus}">${bus}</div>`
                    ).join('');
                    searchResults.style.display = 'block';
                }
            } catch (error) {
                console.error('Error buscando bus:', error);
            }
        });

        // Selección de PPU
        searchResults.addEventListener('click', async (e) => {
            if (e.target.classList.contains('search-item') && !e.target.classList.contains('no-results')) {
                const ppu = e.target.dataset.ppu;
                await seleccionarPPU(ppu);
            }
        });

        async function seleccionarPPU(ppu) {
            ppuSearch.value = ppu;
            ppuSelected.value = ppu;
            searchResults.innerHTML = '';
            searchResults.style.display = 'none';
            ppuSearch.disabled = true;
            changePPUBtn.style.display = 'inline-block';

            // Determinar si es tipo S
            esTipoS = ppu.startsWith('S');
            
            // Mostrar/ocultar campos según tipo
            if (esTipoS) {
                camposTipoS.style.display = 'block';
                selectedPPU.innerHTML = `<span class="badge badge-tipo-s">PPU Seleccionado: ${ppu} (Tipo S - Registro Completo)</span>`;
                // Hacer campos obligatorios
                document.querySelectorAll('#camposTipoS input[type="radio"]').forEach(radio => {
                    radio.required = true;
                });
            } else {
                camposTipoS.style.display = 'none';
                selectedPPU.innerHTML = `<span class="badge badge-tipo-normal">PPU Seleccionado: ${ppu} (Solo Disco Duro)</span>`;
                // Quitar obligatoriedad
                document.querySelectorAll('#camposTipoS input[type="radio"]').forEach(radio => {
                    radio.required = false;
                    radio.checked = false;
                });
            }

            // Verificar si ya fue registrado hoy
            await verificarRegistroHoy(ppu);
        }

        async function verificarRegistroHoy(ppu) {
            try {
                const response = await fetch(`/api/check-bus-today?ppu=${encodeURIComponent(ppu)}`);
                const data = await response.json();

                if (data.registered) {
                    ppuAlert.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span>⚠️ Este bus ya tiene ${data.count} registro(s) hoy. ¿Deseas registrar otro?</span>
                    `;
                    ppuAlert.style.display = 'flex';
                } else {
                    ppuAlert.style.display = 'none';
                }
            } catch (error) {
                console.error('Error verificando registro:', error);
            }
        }

        // Botón para cambiar PPU
        changePPUBtn.addEventListener('click', () => {
            ppuSearch.value = '';
            ppuSelected.value = '';
            selectedPPU.innerHTML = '';
            ppuAlert.style.display = 'none';
            ppuSearch.disabled = false;
            changePPUBtn.style.display = 'none';
            camposTipoS.style.display = 'none';
            document.getElementById('motivoGroup').style.display = 'none';
            ppuSearch.focus();
        });

        // Cerrar resultados al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                searchResults.style.display = 'none';
            }
        });

        // Establecer fecha actual
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('fechaRevision').value = now.toISOString().slice(0, 16);

        // Mostrar/ocultar motivo según conectividad (solo para tipo S)
        document.querySelectorAll('input[name="conectividad"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const motivoGroup = document.getElementById('motivoGroup');
                const motivoInput = document.getElementById('motivo');
                
                if (e.target.value === 'no') {
                    motivoGroup.style.display = 'block';
                    motivoInput.required = true;
                } else {
                    motivoGroup.style.display = 'none';
                    motivoInput.required = false;
                    motivoInput.value = '';
                }
            });
        });

        // Envío del formulario
        document.getElementById('revisionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const ppu = ppuSelected.value;
            if (!ppu) {
                showNotification('Por favor seleccione una PPU', 'error');
                return;
            }

            const formData = {
                ppu: ppu,
                fecha: document.getElementById('fechaRevision').value,
                disco_duro: document.querySelector('input[name="discoDuro"]:checked').value === 'si'
            };

            // Solo agregar campos de conectividad y norma gráfica si es tipo S
            if (esTipoS) {
                const conectividadChecked = document.querySelector('input[name="conectividad"]:checked');
                const normaGraficaChecked = document.querySelector('input[name="normaGrafica"]:checked');

                if (!conectividadChecked || !normaGraficaChecked) {
                    showNotification('Por favor complete todos los campos obligatorios', 'error');
                    return;
                }

                formData.conectividad = conectividadChecked.value === 'si';
                formData.motivo_no_conectividad = document.getElementById('motivo').value || null;
                formData.norma_grafica_correcta = normaGraficaChecked.value === 'si';
            }

            try {
                const response = await fetch('/api/submit-revision', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('Revisión guardada exitosamente', 'success');
                    e.target.reset();
                    selectedPPU.innerHTML = '';
                    ppuSelected.value = '';
                    ppuSearch.value = '';
                    ppuSearch.disabled = false;
                    changePPUBtn.style.display = 'none';
                    ppuAlert.style.display = 'none';
                    camposTipoS.style.display = 'none';
                    document.getElementById('motivoGroup').style.display = 'none';
                    esTipoS = false;
                    
                    // Restablecer fecha actual
                    const now = new Date();
                    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                    document.getElementById('fechaRevision').value = now.toISOString().slice(0, 16);
                } else {
                    showNotification('Error al guardar: ' + result.error, 'error');
                }
            } catch (error) {
                showNotification('Error de conexión: ' + error.message, 'error');
            }
        });

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
